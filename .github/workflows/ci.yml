name: CI
on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - name: Database invariants (migrations + RLS + ledger rules)
        run: npm run test:db
      - uses: denoland/setup-deno@v2
        with:
          deno-version: v2.x
      - name: Edge Functions (type-check + unit tests)
        run: |
          deno check supabase/functions/*/index.ts
          deno test --allow-env supabase/functions
      - name: Type-check shared package
        run: npx tsc -p packages/shared
      - name: Build apps
        run: npm run build
