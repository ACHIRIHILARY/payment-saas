# Local Supabase settings. The CLI fills in defaults for anything not listed.
project_id = "payment-saas"

[db]
major_version = 17

[db.seed]
enabled = true
sql_paths = ["./seed.sql"]

[auth]
site_url = "http://localhost:5173"
additional_redirect_urls = ["http://localhost:5174"]

[auth.email]
enable_signup = true
otp_length = 6
otp_expiry = 600

[auth.email.template.magic_link]
subject = "Your sign-in code"
content_path = "./supabase/templates/magic_link.html"

[auth.mfa]
max_enrolled_factors = 5

[auth.mfa.totp]
enroll_enabled = true
verify_enabled = true

# Webhooks authenticate with their own HMAC signatures, not a Supabase JWT.
[functions.btcpay-webhook]
verify_jwt = false

[functions.kyc-webhook]
verify_jwt = false
